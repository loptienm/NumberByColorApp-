name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "numberbycolor.apk"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore cached debug signing keystore
        id: cache_restore
        uses: actions/cache/restore@v4
        with:
          path: debug.keystore
          key: numberbycolor-debug-keystore-v1

      - name: Restore or generate debug signing keystore
        id: keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "needs_secret_backup=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_secret_backup=true" >> "$GITHUB_OUTPUT"
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            fi
          fi

          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            base64 -w 0 debug.keystore > "${RUNNER_TEMP}/debug.keystore.base64.txt"
            {
              echo "### Signing Key Note"
              echo "A reusable \`debug.keystore\` was cached for active builds (GitHub evicts caches after ~7 days of inactivity)."
              echo "To keep this exact signing key permanently so future APK updates always install without uninstalling:"
              echo "1. Download the \`debug-keystore-base64\` artifact from this workflow run and unzip it."
              echo "2. Copy the text from \`debug.keystore.base64.txt\`."
              echo "3. Paste it into **Settings -> Secrets and variables -> Actions -> New repository secret** named \`DEBUG_KEYSTORE_BASE64\`."
              echo "4. Optionally delete the \`debug-keystore-base64\` artifact from this run afterwards."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save debug signing keystore to cache
        if: steps.cache_restore.outputs.cache-hit != 'true' && steps.keystore.outputs.needs_secret_backup == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: debug.keystore
          key: numberbycolor-debug-keystore-v1

      - name: Upload keystore base64 backup for secret setup
        if: steps.keystore.outputs.needs_secret_backup == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-base64
          path: ${{ runner.temp }}/debug.keystore.base64.txt
          retention-days: 7

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK to numberbycolor.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk numberbycolor.apk

      - name: Upload numberbycolor.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: numberbycolor-apk
          path: numberbycolor.apk

      - name: Commit and push numberbycolor.apk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add numberbycolor.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build numberbycolor.apk [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "numberbycolor.apk is already up to date."
          fi
